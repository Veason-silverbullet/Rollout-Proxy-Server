inference_engine: vllm
transport_mode: vllm_generate

host: 0.0.0.0
port: 9400
proxy_api_delimiter: "|"
save_rollout_sessions: true
rollout_session_dir: sessions
save_rollout_logprobs: true
save_rollout_sampling_masks: false
log_dir: logs

# Server root speaking /inference/v1/generate (Vime router, VeRL server, etc.).
# Agents select the tokenizer and tool parser through their request's model.
router_url: null
router_api_key: null
# Training deployment default: match the actual engine window.
# This transport does not discover the window; null disables clamping with a warning.
context_length: 262144

# Training deployment default: engine and trainer must support routing replay.
# Set false (or use --no-return-routed-experts) when replay is not configured.
return_routed_experts: true
save_rollout_routed_experts: false

# Training policy: runtime push > sampling_overrides > request > generation_config.json.
# top_p < 1, top_k > 0, or min_p > 0 requires sampling masks; enable return_sampling_mask
# at engine startup. Bundled Qwen defaults set top_p: 0.95 and top_k: 20.
# sampling_overrides:
#   temperature: 1.0
#   top_p: 1.0
#   top_k: -1
#   min_p: 0.0
